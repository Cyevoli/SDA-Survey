<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rack Scanner — SDA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #080b12;
    --surface: #0f1420;
    --surface2: #161d2e;
    --surface3: #1e2740;
    --border: rgba(99,140,255,0.1);
    --border2: rgba(99,140,255,0.2);
    --text: #e8eeff;
    --muted: #5a6a8a;
    --accent: #4f8ef7;
    --accent2: #3a6fd8;
    --accent-glow: rgba(79,142,247,0.15);
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.1);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.1);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.1);
    --cyan: #06b6d4;
    --purple: #a78bfa;
    --radius: 12px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GRID BG */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 60px; }

  /* TOPBAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,11,18,0.9);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-icon {
    width: 32px; height: 32px; background: var(--accent);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .topbar-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .api-pill {
    font-size: 10px; font-family: var(--mono); padding: 4px 10px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 20px; color: var(--muted); cursor: pointer;
  }
  .api-pill.set { color: var(--green); border-color: rgba(34,197,94,0.3); background: var(--green-bg); }

  /* API KEY PANEL */
  .api-panel {
    margin: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 16px;
    display: none;
  }
  .api-panel.open { display: block; }
  .api-panel label { font-size: 11px; color: var(--muted); font-family: var(--mono); display: block; margin-bottom: 6px; }
  .api-panel input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text);
    font-family: var(--mono); margin-bottom: 10px;
  }
  .api-panel input:focus { outline: none; border-color: var(--accent); }
  .api-panel-note { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .btn-sm {
    padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 8px;
    border: none; cursor: pointer; font-family: var(--sans);
  }
  .btn-sm.primary { background: var(--accent); color: white; }
  .btn-sm.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); margin-left: 6px; }

  /* CAPTURE ZONE */
  .capture-zone { padding: 16px; }
  .capture-label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono);
    margin-bottom: 10px;
  }

  .camera-btn-wrap { position: relative; }
  input[type=file] { display: none; }

  .camera-btn {
    width: 100%;
    background: var(--surface);
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    padding: 32px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .camera-btn:active { transform: scale(0.98); background: var(--surface2); }
  .camera-btn.has-image {
    padding: 0; border-style: solid; border-color: var(--accent);
    overflow: hidden;
  }
  .camera-btn-icon {
    width: 52px; height: 52px;
    background: var(--accent-glow);
    border: 1px solid var(--border2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .camera-btn-text { font-size: 14px; font-weight: 600; color: var(--text); }
  .camera-btn-sub { font-size: 12px; color: var(--muted); }

  #previewImg {
    width: 100%; border-radius: calc(var(--radius) - 1px);
    display: none;
  }
  #previewImg.show { display: block; }

  .retake-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(8,11,18,0.85); backdrop-filter: blur(8px);
    border: 1px solid var(--border2); border-radius: 8px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    color: var(--text); cursor: pointer; display: none;
  }
  .retake-btn.show { display: block; }

  /* SCAN BTN */
  .scan-btn {
    width: 100%; margin-top: 12px; padding: 16px;
    background: var(--accent); color: white; border: none;
    border-radius: var(--radius); font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: var(--sans); letter-spacing: -0.3px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s;
  }
  .scan-btn:disabled {
    background: var(--surface2); color: var(--muted); cursor: not-allowed;
  }
  .scan-btn:not(:disabled):active { background: var(--accent2); transform: scale(0.98); }

  /* SCANNING ANIMATION */
  .scan-overlay {
    display: none; padding: 24px 16px;
    flex-direction: column; align-items: center; gap: 16px;
  }
  .scan-overlay.show { display: flex; }
  .scan-beam-wrap {
    width: 100%; max-width: 300px; height: 160px;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: var(--radius); position: relative; overflow: hidden;
  }
  .scan-beam {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 12px var(--accent);
    animation: scanBeam 1.5s ease-in-out infinite;
  }
  @keyframes scanBeam {
    0% { top: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
  .scan-rack-lines {
    position: absolute; inset: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .scan-rack-line {
    height: 10px; border-radius: 3px;
    background: var(--surface2); border: 1px solid var(--border);
    animation: pulse 2s ease-in-out infinite;
  }
  .scan-rack-line:nth-child(odd) { animation-delay: 0.3s; }
  .scan-rack-line:nth-child(3n) { animation-delay: 0.6s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
  .scan-status {
    font-size: 13px; font-family: var(--mono); color: var(--accent);
    text-align: center;
  }
  .scan-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  /* RESULTS */
  #results { padding: 0 16px 16px; display: none; }
  #results.show { display: block; }

  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .results-title { font-size: 14px; font-weight: 700; }
  .confidence-pill {
    font-size: 10px; font-family: var(--mono); font-weight: 600;
    padding: 3px 9px; border-radius: 20px;
  }
  .confidence-pill.high { background: var(--green-bg); color: var(--green); }
  .confidence-pill.medium { background: var(--amber-bg); color: var(--amber); }
  .confidence-pill.low { background: var(--red-bg); color: var(--red); }

  /* RACK DIAGRAM */
  .rack-diagram-wrap {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .rack-diagram-header {
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .rack-diagram-label { font-size: 11px; font-weight: 700; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; }
  .rack-u-count { font-size: 11px; font-family: var(--mono); color: var(--accent); }

  #rackSVGWrap { padding: 12px; }
  #rackSVGWrap svg { width: 100%; height: auto; display: block; }

  /* DEVICE LIST */
  .device-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .device-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .device-u-badge {
    font-size: 10px; font-family: var(--mono); font-weight: 700;
    background: var(--surface3); border: 1px solid var(--border2);
    border-radius: 6px; padding: 3px 7px; color: var(--accent);
    white-space: nowrap; flex-shrink: 0; margin-top: 1px;
  }
  .device-info { flex: 1; min-width: 0; }
  .device-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .device-meta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .device-conf {
    font-size: 10px; font-weight: 600; font-family: var(--mono);
    padding: 2px 7px; border-radius: 20px; flex-shrink: 0;
  }
  .device-conf.high { background: var(--green-bg); color: var(--green); }
  .device-conf.medium { background: var(--amber-bg); color: var(--amber); }
  .device-conf.low { background: var(--red-bg); color: var(--red); }

  /* SUMMARY CARDS */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
  }
  .summary-card-label { font-size: 10px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .summary-card-val { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--text); }
  .summary-card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* NOTES */
  .claude-notes {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .claude-notes-label { font-size: 10px; font-family: var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
  .claude-notes-text { font-size: 13px; color: var(--text); line-height: 1.65; }

  /* ACTION ROW */
  .action-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .action-btn {
    flex: 1; padding: 11px 8px; font-size: 12px; font-weight: 600;
    border-radius: var(--radius); border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text); cursor: pointer;
    font-family: var(--sans); text-align: center;
    transition: all 0.15s;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }

  /* WARNINGS */
  .warning-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .warning-item {
    background: var(--amber-bg); border: 1px solid rgba(245,158,11,0.25);
    border-radius: 8px; padding: 10px 12px;
    font-size: 12px; color: var(--amber); line-height: 1.5;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .warning-item::before { content: '⚠'; flex-shrink: 0; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 12px 20px;
    font-size: 13px; font-weight: 500; color: var(--text);
    transition: transform 0.3s ease; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(34,197,94,0.4); color: var(--green); }
  .toast.error { border-color: rgba(239,68,68,0.4); color: var(--red); }

  /* SVG Rack styles */
  .rack-unit-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #5a6a8a; }
  .rack-device-label { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; }
  .rack-device-sublabel { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #8892a8; }
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">📡</div>
      <div>
        <div class="topbar-title">Rack Scanner</div>
        <div class="topbar-sub">SDA Site Readiness</div>
      </div>
    </div>
    <div class="api-pill" id="apiPill" onclick="toggleApiPanel()">API Key ▾</div>
  </div>

  <!-- API KEY PANEL -->
  <div class="api-panel" id="apiPanel">
    <label>ANTHROPIC API KEY</label>
    <p class="api-panel-note">Your key is stored only in this browser session (sessionStorage). It is never sent anywhere except directly to api.anthropic.com.</p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false">
    <div>
      <button class="btn-sm primary" onclick="saveApiKey()">Save key</button>
      <button class="btn-sm ghost" onclick="toggleApiPanel()">Cancel</button>
    </div>
  </div>

  <!-- CAPTURE ZONE -->
  <div class="capture-zone">
    <div class="capture-label">Step 1 — Capture rack photo</div>
    <div class="camera-btn-wrap">
      <label for="photoInput">
        <div class="camera-btn" id="cameraBtnDiv">
          <div class="camera-btn-icon">📷</div>
          <div class="camera-btn-text">Take photo or upload</div>
          <div class="camera-btn-sub">Point camera at your network rack</div>
          <img id="previewImg" alt="Rack preview">
        </div>
      </label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">
      <button class="retake-btn" id="retakeBtn" onclick="retakePhoto()">↺ Retake</button>
    </div>

    <button class="scan-btn" id="scanBtn" onclick="startScan()" disabled>
      <span>🔍</span> Scan with Claude AI
    </button>
  </div>

  <!-- SCANNING ANIMATION -->
  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-beam-wrap">
      <div class="scan-beam"></div>
      <div class="scan-rack-lines">
        <div class="scan-rack-line" style="width:90%"></div>
        <div class="scan-rack-line" style="width:85%"></div>
        <div class="scan-rack-line" style="width:88%;height:20px"></div>
        <div class="scan-rack-line" style="width:92%"></div>
        <div class="scan-rack-line" style="width:87%"></div>
        <div class="scan-rack-line" style="width:89%;height:20px"></div>
        <div class="scan-rack-line" style="width:91%"></div>
        <div class="scan-rack-line" style="width:86%"></div>
      </div>
    </div>
    <div class="scan-status">Analyzing rack<span class="scan-dots"></span></div>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="results-header">
      <div class="results-title">Scan Results</div>
      <div class="confidence-pill" id="overallConfPill">—</div>
    </div>

    <!-- SUMMARY GRID -->
    <div class="summary-grid" id="summaryGrid"></div>

    <!-- RACK DIAGRAM -->
    <div class="rack-diagram-wrap">
      <div class="rack-diagram-header">
        <div class="rack-diagram-label">Rack Elevation</div>
        <div class="rack-u-count" id="rackUCount">—</div>
      </div>
      <div id="rackSVGWrap"></div>
    </div>

    <!-- DEVICE LIST -->
    <div class="capture-label" style="padding:0 0 10px">Detected Equipment</div>
    <div class="device-list" id="deviceList"></div>

    <!-- WARNINGS -->
    <div id="warningsList"></div>

    <!-- CLAUDE NOTES -->
    <div class="claude-notes" id="claudeNotes" style="display:none">
      <div class="claude-notes-label">🤖 Claude's observations</div>
      <div class="claude-notes-text" id="claudeNotesText"></div>
    </div>

    <!-- ACTIONS -->
    <div class="action-row">
      <button class="action-btn" onclick="copyJSON()">Copy JSON</button>
      <button class="action-btn" onclick="downloadSVG()">Save SVG</button>
      <button class="action-btn primary" onclick="copyToForm()">Copy to survey →</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ────────────────────────────────────────────────
let apiKey = sessionStorage.getItem('sda_api_key') || '';
let imageBase64 = null;
let scanResult = null;

// ─── INIT ─────────────────────────────────────────────────
window.onload = () => {
  if (apiKey) updateApiPill(true);
};

// ─── API KEY ──────────────────────────────────────────────
function toggleApiPanel() {
  const panel = document.getElementById('apiPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open') && apiKey) {
    document.getElementById('apiKeyInput').value = apiKey;
  }
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val.startsWith('sk-')) { showToast('Key should start with sk-', 'error'); return; }
  apiKey = val;
  sessionStorage.setItem('sda_api_key', val);
  updateApiPill(true);
  document.getElementById('apiPanel').classList.remove('open');
  showToast('API key saved', 'success');
  updateScanBtn();
}

function updateApiPill(set) {
  const pill = document.getElementById('apiPill');
  pill.textContent = set ? '✓ API Key set' : 'API Key ▾';
  pill.className = set ? 'api-pill set' : 'api-pill';
}

// ─── PHOTO CAPTURE ────────────────────────────────────────
function handlePhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    imageBase64 = e.target.result.split(',')[1];
    const img = document.getElementById('previewImg');
    img.src = e.target.result;
    img.classList.add('show');
    document.getElementById('cameraBtnDiv').classList.add('has-image');
    document.querySelector('.camera-btn-icon').style.display = 'none';
    document.querySelector('.camera-btn-text').style.display = 'none';
    document.querySelector('.camera-btn-sub').style.display = 'none';
    document.getElementById('retakeBtn').classList.add('show');
    updateScanBtn();
  };
  reader.readAsDataURL(file);
}

function retakePhoto() {
  imageBase64 = null;
  document.getElementById('photoInput').value = '';
  document.getElementById('previewImg').classList.remove('show');
  document.getElementById('previewImg').src = '';
  document.getElementById('cameraBtnDiv').classList.remove('has-image');
  document.querySelector('.camera-btn-icon').style.display = '';
  document.querySelector('.camera-btn-text').style.display = '';
  document.querySelector('.camera-btn-sub').style.display = '';
  document.getElementById('retakeBtn').classList.remove('show');
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').classList.remove('show');
  updateScanBtn();
}

function updateScanBtn() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = !(imageBase64 && apiKey);
  btn.textContent = !apiKey ? '🔑 Set API key first' : !imageBase64 ? '📷 Take photo first' : '🔍 Scan with Claude AI';
}

// ─── SCAN ─────────────────────────────────────────────────
async function startScan() {
  if (!imageBase64 || !apiKey) return;

  // Show scanning
  document.getElementById('scanOverlay').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').style.display = 'none';
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('scanBtn').textContent = 'Scanning...';

  const prompt = `You are a network infrastructure expert analyzing a photo of a network rack or IDF/MDF cabinet.

Identify all equipment visible in the rack and produce a structured JSON response. Be precise about U positions if visible, otherwise estimate from visual position.

Return ONLY valid JSON with this exact structure (no markdown, no explanation, just the JSON object):
{
  "rack_units_total": <number or null if unknown>,
  "rack_units_used": <number>,
  "overall_confidence": "high" | "medium" | "low",
  "devices": [
    {
      "u_position": <number or null>,
      "u_size": <number, default 1>,
      "type": "switch" | "patch_panel" | "ups" | "server" | "router" | "firewall" | "ap_controller" | "pdu" | "cable_management" | "fiber_panel" | "modem" | "other",
      "vendor": "<string or null>",
      "model": "<string or null>",
      "ports": <number or null>,
      "notes": "<short string>",
      "confidence": "high" | "medium" | "low"
    }
  ],
  "warnings": ["<string>", ...],
  "observations": "<2-3 sentence paragraph about cable management quality, rack organization, any concerns, notable equipment>"
}

Notes:
- List devices top to bottom in the rack (highest U number first if visible)
- Include blank/empty space as type "other" with notes "Empty space" only if it's significant
- warnings = anything that could affect a network upgrade: full rack, cable mess, no UPS, heat concerns, etc.
- Be specific about vendors/models if logos or labels are visible; otherwise use null`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: {
                type: 'base64',
                media_type: 'image/jpeg',
                data: imageBase64
              }
            },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || `API error ${response.status}`);
    }

    const data = await response.json();
    const text = data.content[0].text.trim();

    // Parse JSON — strip any accidental markdown fences
    const clean = text.replace(/^```json?\s*/i, '').replace(/```\s*$/,'').trim();
    scanResult = JSON.parse(clean);
    renderResults(scanResult);

  } catch(e) {
    showToast('Error: ' + e.message, 'error');
    document.getElementById('scanBtn').disabled = false;
    document.getElementById('scanBtn').textContent = '🔍 Scan with Claude AI';
  } finally {
    document.getElementById('scanOverlay').classList.remove('show');
  }
}

// ─── RENDER RESULTS ───────────────────────────────────────
function renderResults(data) {
  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  resultsEl.classList.add('show');
  document.getElementById('scanBtn').disabled = false;
  document.getElementById('scanBtn').textContent = '🔄 Re-scan';

  // Overall confidence
  const confPill = document.getElementById('overallConfPill');
  confPill.textContent = (data.overall_confidence || 'medium').toUpperCase();
  confPill.className = 'confidence-pill ' + (data.overall_confidence || 'medium');

  // Summary grid
  const deviceTypes = {};
  (data.devices || []).forEach(d => {
    if (d.type === 'other' && d.notes?.includes('Empty')) return;
    deviceTypes[d.type] = (deviceTypes[d.type] || 0) + 1;
  });
  const switches = (deviceTypes['switch'] || 0);
  const patchPanels = (deviceTypes['patch_panel'] || 0) + (deviceTypes['fiber_panel'] || 0);
  const used = data.rack_units_used || 0;
  const total = data.rack_units_total || '?';

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card">
      <div class="summary-card-label">Rack Units</div>
      <div class="summary-card-val">${used}<span style="font-size:13px;color:var(--muted)">/${total}</span></div>
      <div class="summary-card-sub">used of total</div>
    </div>
    <div class="summary-card">
      <div class="summary-card-label">Devices Found</div>
      <div class="summary-card-val">${(data.devices||[]).filter(d=>!(d.type==='other'&&d.notes?.includes('Empty'))).length}</div>
      <div class="summary-card-sub">${switches} switch${switches!==1?'es':''}, ${patchPanels} patch panel${patchPanels!==1?'s':''}</div>
    </div>
  `;

  // Rack U count label
  document.getElementById('rackUCount').textContent = total !== '?' ? `${total}U rack` : 'U count estimated';

  // Render SVG rack diagram
  renderRackSVG(data);

  // Device list
  const list = document.getElementById('deviceList');
  list.innerHTML = '';
  (data.devices || []).forEach(d => {
    if (d.type === 'other' && d.notes?.includes('Empty')) return;
    const card = document.createElement('div');
    card.className = 'device-card';
    const uLabel = d.u_position ? `U${d.u_position}` + (d.u_size > 1 ? `–${d.u_position + d.u_size - 1}` : '') : '?U';
    const name = formatDeviceName(d);
    card.innerHTML = `
      <div class="device-u-badge">${uLabel}</div>
      <div class="device-info">
        <div class="device-name">${name}</div>
        <div class="device-meta">${d.type.replace('_',' ')}${d.ports ? ' · ' + d.ports + ' ports' : ''}${d.notes && d.notes !== 'null' ? ' · ' + d.notes : ''}</div>
      </div>
      <div class="device-conf ${d.confidence || 'medium'}">${(d.confidence||'med').toUpperCase()}</div>
    `;
    list.appendChild(card);
  });

  // Warnings
  const warnWrap = document.getElementById('warningsList');
  warnWrap.innerHTML = '';
  if (data.warnings && data.warnings.length) {
    const wlist = document.createElement('div');
    wlist.className = 'warning-list';
    data.warnings.forEach(w => {
      const item = document.createElement('div');
      item.className = 'warning-item';
      item.textContent = w;
      wlist.appendChild(item);
    });
    warnWrap.appendChild(wlist);
  }

  // Claude notes
  if (data.observations) {
    document.getElementById('claudeNotes').style.display = 'block';
    document.getElementById('claudeNotesText').textContent = data.observations;
  }
}

function formatDeviceName(d) {
  if (d.vendor && d.model) return d.vendor + ' ' + d.model;
  if (d.vendor) return d.vendor + ' ' + d.type.replace('_',' ');
  if (d.model) return d.model;
  return d.type.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

// ─── SVG RACK DIAGRAM ─────────────────────────────────────
function renderRackSVG(data) {
  const devices = data.devices || [];
  const totalU = data.rack_units_total || Math.max(12, (data.rack_units_used || 0) + 2);

  const UH = 22;       // pixels per U
  const LEFT = 36;     // left margin for U labels
  const W = 320;       // rack interior width
  const PAD = 10;      // padding
  const HEIGHT = totalU * UH + PAD * 2;
  const SVG_W = LEFT + W + PAD;

  // Color map
  const typeColor = {
    switch:          { fill: '#1a2a4a', stroke: '#4f8ef7', label: '#a8c4ff' },
    patch_panel:     { fill: '#1a2a1a', stroke: '#22c55e', label: '#86efac' },
    fiber_panel:     { fill: '#1a2a1a', stroke: '#06b6d4', label: '#67e8f9' },
    ups:             { fill: '#2a2a1a', stroke: '#f59e0b', label: '#fcd34d' },
    server:          { fill: '#2a1a2a', stroke: '#a78bfa', label: '#c4b5fd' },
    router:          { fill: '#1a2a4a', stroke: '#60a5fa', label: '#93c5fd' },
    firewall:        { fill: '#2a1a1a', stroke: '#ef4444', label: '#fca5a5' },
    ap_controller:   { fill: '#1a2a2a', stroke: '#06b6d4', label: '#67e8f9' },
    pdu:             { fill: '#2a2a2a', stroke: '#9ca3af', label: '#d1d5db' },
    cable_management:{ fill: '#1a1a1a', stroke: '#374151', label: '#6b7280' },
    modem:           { fill: '#1a2a1a', stroke: '#34d399', label: '#6ee7b7' },
    other:           { fill: '#161d2e', stroke: '#2a3a5a', label: '#4a5568' },
  };

  // Build device map by U position
  const deviceMap = {};
  devices.forEach(d => {
    if (d.u_position) {
      deviceMap[d.u_position] = d;
    }
  });

  // Devices without U positions — place them sequentially in gaps
  const unplaced = devices.filter(d => !d.u_position && d.type !== 'other');
  let nextU = totalU;
  unplaced.forEach(d => {
    while (deviceMap[nextU] && nextU > 0) nextU--;
    if (nextU > 0) { d.u_position = nextU; deviceMap[nextU] = d; nextU--; }
  });

  let svgContent = `<svg viewBox="0 0 ${SVG_W} ${HEIGHT + PAD}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rackBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0f1a2a"/>
    </linearGradient>
  </defs>
  <!-- Rack body -->
  <rect x="${LEFT}" y="${PAD}" width="${W}" height="${totalU * UH}" fill="url(#rackBg)" stroke="rgba(99,140,255,0.2)" stroke-width="1" rx="3"/>
  `;

  // U guides
  for (let u = 1; u <= totalU; u++) {
    const y = PAD + (totalU - u) * UH;
    svgContent += `<text x="${LEFT - 4}" y="${y + UH/2 + 3}" text-anchor="end" class="rack-unit-label">${u}U</text>`;
    svgContent += `<line x1="${LEFT}" y1="${y + UH}" x2="${LEFT + W}" y2="${y + UH}" stroke="rgba(99,140,255,0.08)" stroke-width="0.5"/>`;
  }

  // Rendered U tracking (avoid overlaps)
  const rendered = new Set();

  // Draw devices
  devices.forEach(d => {
    if (!d.u_position) return;
    if (rendered.has(d.u_position)) return;
    const size = d.u_size || 1;
    const y = PAD + (totalU - d.u_position - size + 1) * UH;
    const h = size * UH - 2;
    const colors = typeColor[d.type] || typeColor.other;
    const name = formatDeviceName(d);
    const shortName = name.length > 32 ? name.slice(0, 30) + '…' : name;

    svgContent += `
    <rect x="${LEFT + 2}" y="${y + 1}" width="${W - 4}" height="${h}" fill="${colors.fill}" stroke="${colors.stroke}" stroke-width="1" rx="2"/>
    <text x="${LEFT + 12}" y="${y + (h/2) + (size > 1 ? -4 : 4)}" class="rack-device-label" fill="${colors.label}">${shortName}</text>
    ${size > 1 ? `<text x="${LEFT + 12}" y="${y + h/2 + 12}" class="rack-device-sublabel">${d.type.replace(/_/g,' ')}${d.ports ? ' · ' + d.ports + 'p' : ''}</text>` : ''}
    `;

    // Port dots for switches/patch panels
    if ((d.type === 'switch' || d.type === 'patch_panel') && d.ports) {
      const maxDots = Math.min(d.ports, 48);
      const dotR = 2.5;
      const dotSpacing = 6;
      const startX = LEFT + W - 14 - (maxDots * dotSpacing);
      const dotY = y + h / 2;
      for (let i = 0; i < maxDots; i++) {
        svgContent += `<circle cx="${startX + i * dotSpacing}" cy="${dotY}" r="${dotR}" fill="${colors.stroke}" opacity="0.6"/>`;
      }
    }

    for (let s = 0; s < size; s++) rendered.add(d.u_position + s);
  });

  svgContent += `</svg>`;
  document.getElementById('rackSVGWrap').innerHTML = svgContent;
}

// ─── ACTIONS ──────────────────────────────────────────────
function copyJSON() {
  if (!scanResult) return;
  navigator.clipboard.writeText(JSON.stringify(scanResult, null, 2))
    .then(() => showToast('JSON copied!', 'success'))
    .catch(() => showToast('Copy failed', 'error'));
}

function downloadSVG() {
  const svgEl = document.querySelector('#rackSVGWrap svg');
  if (!svgEl) return;
  const blob = new Blob([svgEl.outerHTML], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rack-diagram.svg';
  a.click(); URL.revokeObjectURL(url);
  showToast('SVG downloaded', 'success');
}

function copyToForm() {
  if (!scanResult) return;
  // Build a summary text that can be pasted into the survey notes
  const lines = [];
  lines.push(`=== RACK SCAN RESULTS ===`);
  lines.push(`Rack units: ${scanResult.rack_units_used || '?'}U used / ${scanResult.rack_units_total || '?'}U total`);
  lines.push(`Confidence: ${scanResult.overall_confidence || 'medium'}`);
  lines.push('');
  lines.push('DETECTED EQUIPMENT:');
  (scanResult.devices || []).forEach(d => {
    if (d.type === 'other' && d.notes?.includes('Empty')) return;
    const uStr = d.u_position ? `U${d.u_position}` : '?U';
    lines.push(`  ${uStr} — ${formatDeviceName(d)} [${d.type.replace(/_/g,' ')}]${d.ports ? ', ' + d.ports + ' ports' : ''}`);
  });
  if (scanResult.warnings?.length) {
    lines.push('');
    lines.push('WARNINGS:');
    scanResult.warnings.forEach(w => lines.push('  ⚠ ' + w));
  }
  if (scanResult.observations) {
    lines.push('');
    lines.push('NOTES:');
    lines.push(scanResult.observations);
  }
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => showToast('Copied — paste into survey notes', 'success'))
    .catch(() => showToast('Copy failed', 'error'));
}

// ─── TOAST ────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
